name: Bug report
description: Report a reproducible problem without personal data or credentials
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include cookies, tokens, passwords, API keys, MSSV, email, screenshots with personal data, or raw network logs. Security reports must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
