name: uit_portal_app
description: "Native Flutter Android client for UIT Portal with AppAuth SSO."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  flutter_appauth: ^12.0.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  llamadart: ^0.8.16

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
