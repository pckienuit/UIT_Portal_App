name: uit_portal_app
description: "Unofficial native Flutter Android client for UIT Portal."
publish_to: 'none'
repository: https://github.com/pckienuit/UIT_Portal_App
issue_tracker: https://github.com/pckienuit/UIT_Portal_App/issues
homepage: https://github.com/pckienuit/UIT_Portal_App

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  flutter_appauth: ^12.0.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  llamadart: ^0.8.16
  flutter_markdown_plus: ^1.0.12
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - android/app/src/main/assets/nodejs-project/provider_catalog.json
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
